# ==============================================================================
# E-Summit 2026 Live Development Docker Compose Configuration
# Features: Instant Auto-Reload, Hot Module Replacement (HMR) & Volume Mounts
# ==============================================================================
#
# Usage:
#   1. Start all services with live reload:
#      docker compose -f docker-compose.dev.yml up --build
#   2. Start in background (detached):
#      docker compose -f docker-compose.dev.yml up --build -d
#   3. Stop dev stack:
#      docker compose -f docker-compose.dev.yml down
# ==============================================================================

services:
  # ── 1. Backend API (NestJS with Watch Mode) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: esummit-dev-backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - esummit-dev-network

  # ── 2. Public Frontend (Next.js with Fast Refresh) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: esummit-dev-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - esummit-dev-network

  # ── 3. Admin Dashboard (Next.js Turbopack Live Reload) ──
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: esummit-dev-admin
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - esummit-dev-network

networks:
  esummit-dev-network:
    driver: bridge
