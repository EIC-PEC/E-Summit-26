# ==============================================================================
# E-Summit 2026 Nginx Reverse Proxy Configuration
# ==============================================================================
# 
# TODO (DevOps / Infra):
# 1. Copy this file to your VPS:
#    sudo cp nginx/esummit.conf /etc/nginx/sites-available/esummit.conf
#
# 2. Enable site configuration:
#    sudo ln -s /etc/nginx/sites-available/esummit.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 3. Obtain and configure automatic SSL certificates via Certbot:
#    sudo certbot --nginx -d esummit.pec.ac.in -d www.esummit.pec.ac.in -d admin.esummit.pec.ac.in -d api.esummit.pec.ac.in
#
# 4. Verify Cloudflare SSL mode is set to "Full (Strict)" if using Cloudflare Proxy.
# ==============================================================================

# 1. Main Public Website (Next.js 14)
server {
    server_name esummit.pec.ac.in www.esummit.pec.ac.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Admin CMS Dashboard (Next.js 16)
server {
    server_name admin.esummit.pec.ac.in;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Backend REST API Engine (NestJS)
server {
    server_name api.esummit.pec.ac.in;

    # Maximum payload size for file uploads
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
