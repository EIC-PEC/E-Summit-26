# ==============================================================================
# E-Summit 2026 Production Docker Compose Configuration
# ==============================================================================
#
# TODO (DevOps / Infra):
# 1. Ensure backend/.env exists on VPS before running `docker compose up -d`.
# 2. To build and run in production:
#    docker compose up --build -d
# 3. To view running service logs:
#    docker compose logs -f
# 4. To stop all services:
#    docker compose down
# ==============================================================================

services:
  # ── 1. Backend API (NestJS + MongoDB Atlas) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esummit-backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    networks:
      - esummit-network

  # ── 2. Public Frontend (Next.js 14) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # TODO (DevOps): Set to your production API URL if building standalone
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    container_name: esummit-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - esummit-network

  # ── 3. Admin CMS Dashboard (Next.js 16) ──
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # TODO (DevOps): Set to your production API URL if building standalone
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    container_name: esummit-admin
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - esummit-network

networks:
  esummit-network:
    driver: bridge
