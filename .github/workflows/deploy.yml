name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Backend Build
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Verify Frontend Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Verify Admin Build
        working-directory: ./admin
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting E-Summit Deployment..."
            
            cd ~/E-SUMMIT || cd /var/www/esummit || cd /app/esummit
            
            git fetch origin main
            git reset --hard origin/main
            
            docker compose up --build -d --remove-orphans
            
            docker image prune -f
            
            echo "Verifying service health..."
            sleep 5
            curl -f http://localhost:4000/api/v1/health || (echo "Backend Health Check Failed!" && exit 1)
            
            echo "E-Summit Successfully Deployed to Production."
