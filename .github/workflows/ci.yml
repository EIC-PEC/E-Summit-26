name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-checks:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install & Generate Prisma Client
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  frontend-checks:
    name: Frontend (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  admin-checks:
    name: Admin CMS (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install & Build Admin
        working-directory: ./admin
        run: |
          npm ci
          npm run build
